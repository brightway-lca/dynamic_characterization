# Biosphere flows -> FAIR emission species.
#
# Matching is EXACT, never by substring: a substring rule like "methane" also
# matches "Tetrafluoromethane", "Trifluoromethane", "Dichloromethane", ... and
# would characterize every halocarbon as CH4. A flow is looked up by its
# lower-cased name first, and by CAS number as a fallback so that other
# naming conventions (older ecoinvent, SimaPro, ...) still resolve.
#
# CO2 is deliberately absent from `by_cas`: fossil, biogenic and uptake flows
# share CAS 124-38-9 but must be routed to different species and signs.
#
# Individual NMVOC species (ethane, toluene, ...) are not mapped: inventories
# usually carry the aggregate NMVOC flow as well, and mapping both would
# double-count the ozone precursor.

by_name:
  # --- CO2 -----------------------------------------------------------------
  "carbon dioxide, fossil": "CO2 FFI"
  "carbon dioxide, non-fossil": "CO2 AFOLU"
  "carbon dioxide, from soil or biomass stock": "CO2 AFOLU"
  "carbon dioxide, to soil or biomass stock": "CO2 AFOLU"
  "carbon dioxide, non-fossil, resource correction": "CO2 AFOLU"
  "carbon dioxide, in air": "CO2 AFOLU"
  # --- other long-lived GHGs ----------------------------------------------
  "methane, fossil": "CH4"
  "methane, non-fossil": "CH4"
  "methane, from soil or biomass stock": "CH4"
  "dinitrogen monoxide": "N2O"
  # --- short-lived climate forcers ----------------------------------------
  "carbon monoxide, fossil": "CO"
  "carbon monoxide, non-fossil": "CO"
  "carbon monoxide, from soil or biomass stock": "CO"
  "nmvoc, non-methane volatile organic compounds": "VOC"
  "voc, volatile organic compounds": "VOC"
  "nitrogen oxides": "NOx"
  "nitric oxide": "NOx"
  "dinitrogen tetroxide": "NOx"
  "sulfur dioxide": "Sulfur"
  "sulfur oxides": "Sulfur"
  "sulfur trioxide": "Sulfur"
  "ammonia": "NH3"
  # --- F-gases -------------------------------------------------------------
  "sulfur hexafluoride": "SF6"
  "nitrogen fluoride": "NF3"
  "nitrogen trifluoride": "NF3"
  "sulfuryl fluoride": "SO2F2"
  "tetrafluoromethane": "CF4"
  "hexafluoroethane": "C2F6"
  "octafluoropropane": "C3F8"
  "octafluorocyclobutane": "c-C4F8"
  "decafluorobutane": "C4F10"
  "perfluoropentane": "C5F12"
  "tetradecafluorohexane": "C6F14"
  "trifluoromethane": "HFC-23"
  "difluoromethane": "HFC-32"
  "pentafluoroethane": "HFC-125"
  "1,1,1,2-tetrafluoroethane": "HFC-134a"
  "1,1,1-trifluoroethane": "HFC-143a"
  "1,1-difluoroethane": "HFC-152a"
  "1,1,1,2,3,3,3-heptafluoropropane": "HFC-227ea"
  # --- ozone-depleting substances -----------------------------------------
  "trichlorofluoromethane": "CFC-11"
  "dichlorodifluoromethane": "CFC-12"
  "1,1,2-trichloro-1,2,2-trifluoroethane": "CFC-113"
  "1,2-dichloro-1,1,2,2-tetrafluoroethane": "CFC-114"
  "monochloropentafluoroethane": "CFC-115"
  "chlorodifluoromethane": "HCFC-22"
  "1,1-dichloro-1-fluoroethane": "HCFC-141b"
  "1-chloro-1,1-difluoroethane": "HCFC-142b"
  "carbon tetrachloride": "CCl4"
  "chloroform": "CHCl3"
  "dichloromethane": "CH2Cl2"
  "methylchloride": "CH3Cl"
  "1,1,1-trichloroethane": "CH3CCl3"
  "bromomethane": "CH3Br"
  "bromochlorodifluoromethane": "Halon-1211"
  "bromotrifluoromethane": "Halon-1301"
  "dibromotetrafluoroethane": "Halon-2402"
  # --- older ecoinvent / SimaPro spellings of the same substances ----------
  "methane, tetrafluoro-, r-14": "CF4"
  "ethane, hexafluoro-, hfc-116": "C2F6"
  "methane, trifluoro-, hfc-23": "HFC-23"
  "methane, difluoro-, hfc-32": "HFC-32"
  "ethane, pentafluoro-, hfc-125": "HFC-125"
  "ethane, 1,1,1,2-tetrafluoro-, hfc-134a": "HFC-134a"
  "ethane, 1,1,1-trifluoro-, hfc-143a": "HFC-143a"
  "ethane, 1,1-difluoro-, hfc-152a": "HFC-152a"
  "methane, trichlorofluoro-, cfc-11": "CFC-11"
  "methane, dichlorodifluoro-, cfc-12": "CFC-12"
  "ethane, 1,1,2-trichloro-1,2,2-trifluoro-, cfc-113": "CFC-113"
  "ethane, 1,2-dichloro-1,1,2,2-tetrafluoro-, cfc-114": "CFC-114"
  "ethane, chloropentafluoro-, cfc-115": "CFC-115"
  "methane, chlorodifluoro-, hcfc-22": "HCFC-22"
  "ethane, 1,1-dichloro-1-fluoro-, hcfc-141b": "HCFC-141b"
  "ethane, 1-chloro-1,1-difluoro-, hcfc-142b": "HCFC-142b"
  "methane, tetrachloro-, r-10": "CCl4"
  "methane, trichloro-, hcc-20": "CHCl3"
  "methane, dichloro-, hcc-30": "CH2Cl2"
  "methane, monochloro-, r-40": "CH3Cl"
  "ethane, 1,1,1-trichloro-, hcfc-140": "CH3CCl3"
  "methane, bromo-, halon 1001": "CH3Br"
  "methane, bromochlorodifluoro-, halon 1211": "Halon-1211"
  "methane, bromotrifluoro-, halon 1301": "Halon-1301"
  "ethane, 1,2-dibromotetrafluoro-, halon 2402": "Halon-2402"

