# Flows that remove a species from the atmosphere rather than emitting it.
signs:
  "carbon dioxide, in air": -1
  "carbon dioxide, to soil or biomass stock": -1
  "carbon dioxide, non-fossil, resource correction": -1

# FAIR expects some species on a different mass basis than the inventory
# reports them (NOx as NO2, sulfur as SO2). Factor applied to the flow amount.
mass_basis:
  by_name:
    "nitric oxide": 1.5335 # NO -> NO2
    "sulfur trioxide": 0.8002 # SO3 -> SO2
  by_cas:
    "010102-43-9": 1.5335
    "007446-11-9": 0.8002

# Precursor species -> FAIR forcing response channel.
# NOTE: This mapping is informational/reserved metadata documenting which forcing
# channel each precursor drives in FAIR. FAIR applies these responses natively when
# the precursor emission species (NOx, VOC, Sulfur, etc.) is perturbed; this package
# does not route them separately, so the precursor table is not used for calculations.
precursors:
  "NOx": "Ozone"
  "VOC": "Ozone"
  "CO": "Ozone"
  "Sulfur": "Aerosol-radiation interactions"
  "NH3": "Aerosol-radiation interactions"
